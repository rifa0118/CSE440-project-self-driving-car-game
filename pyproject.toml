[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cse440-self-driving-car"
version = "1.0.0"
description = "A Pygame racing game with a PyTorch Deep Q-Network reinforcement-learning agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "matplotlib>=3.8,<4",
  "pygame>=2.5,<3",
  "torch>=2.2,<3",
]

[project.scripts]
self-driving-car = "main:main"

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "game*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["assets", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
